# Isolated staging service. The database is the dedicated Neon Free staging project;
# DATABASE_URL is supplied as a Render secret and is never stored in this repository.
services:
  - type: web
    name: nummiox-staging
    runtime: node
    plan: free
    region: singapore
    branch: feature/household-collaboration
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run db:generate && npm run db:migrate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_USERNAME
        value: nummioX_bot
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CLIENT_ORIGIN
        value: https://nummiox-staging.onrender.com
