name: nummioX Telegram payment reminders

on:
  schedule:
    # GitHub Actions cron is UTC. The worker evaluates each user's local reminder time.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nummiox-telegram-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    name: Run one reminder delivery pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required staging secrets
        id: required-secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [[ -z "$DATABASE_URL" || -z "$TELEGRAM_BOT_TOKEN" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Telegram reminder job skipped: staging DATABASE_URL and/or TELEGRAM_BOT_TOKEN secret is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout staging application code
        if: steps.required-secrets.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          ref: feature/household-collaboration

      - name: Set up Node.js
        if: steps.required-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: steps.required-secrets.outputs.configured == 'true'
        run: npm ci

      - name: Generate Prisma Client
        if: steps.required-secrets.outputs.configured == 'true'
        run: npm run db:generate

      - name: Build reminder worker
        if: steps.required-secrets.outputs.configured == 'true'
        run: npm --workspace server run build

      - name: Deliver due payment reminders
        if: steps.required-secrets.outputs.configured == 'true'
        run: npm --workspace server run telegram:reminders
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
