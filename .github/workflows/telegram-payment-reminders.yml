name: nummioX Telegram payment reminders

on:
  schedule:
    # GitHub Actions cron is UTC. The worker evaluates each user's local reminder time.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nummiox-telegram-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    name: Run one reminder delivery pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout staging application code
        uses: actions/checkout@v5
        with:
          ref: feature/household-collaboration

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build reminder worker
        run: npm --workspace server run build

      - name: Deliver due payment reminders
        run: npm --workspace server run telegram:reminders
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
