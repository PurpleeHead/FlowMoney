name: Temporary Vitest 5 dependency refresh

on:
  push:
    branches: [security/vitest-5-dev-tooling]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Refresh and patch lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm audit fix --package-lock-only --no-fund || true
          npm audit --json > /tmp/audit.json || true
          node -e "const a=require('/tmp/audit.json'); console.log(JSON.stringify({summary:a.metadata?.vulnerabilities,packages:Object.entries(a.vulnerabilities ?? {}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))},null,2))"
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh patched Vitest 5 toolchain"
          git push
