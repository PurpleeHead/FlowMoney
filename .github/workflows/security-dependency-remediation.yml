name: Security dependency remediation

on:
  pull_request:
    branches:
      - stage3-unified-journal-api

permissions:
  contents: read

jobs:
  refresh-lockfile:
    if: github.head_ref == 'security/dependency-audit-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-audit-remediation
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update npm to a version with the peer-resolution fix
        run: npm install --global npm@11.19.1
      - name: Confirm toolchain versions
        run: |
          node --version
          npm --version
      - name: Install exact lockfile
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Run test suites
        run: npm test
      - name: Build production bundles
        run: npm run build
      - name: Report remaining vulnerabilities
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('Dependency audit summary:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log([item.severity.toUpperCase(), name, `range=${item.range}`, `fixAvailable=${JSON.stringify(item.fixAvailable)}`].join(' | '));
          }
          NODE
