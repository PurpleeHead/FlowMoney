name: Security dependency remediation

on:
  push:
    branches:
      - security/dependency-audit-remediation
  pull_request:
    branches:
      - stage3-unified-journal-api

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: (github.event_name == 'pull_request' && github.head_ref == 'security/dependency-audit-remediation') || (github.event_name == 'push' && github.event.head_commit.message == 'chore(security): prepare dependency remediation')
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-audit-remediation
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install exact lockfile
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Run test suites
        run: npm test
      - name: Build production bundles
        run: npm run build
      - name: Report remaining vulnerabilities
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('Dependency audit summary:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log([item.severity.toUpperCase(), name, `range=${item.range}`, `fixAvailable=${JSON.stringify(item.fixAvailable)}`].join(' | '));
          }
          NODE
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches the dependency manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(security): refresh dependency lockfile"
          git push origin security/dependency-audit-remediation
