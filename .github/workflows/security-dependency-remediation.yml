name: Security dependency remediation

on:
  pull_request:
    branches:
      - stage3-unified-journal-api
      - release/production-candidate-2026-10-19

# This workflow executes package lifecycle scripts and tests from the PR checkout.
# It must never have write permission or push commits using a privileged token.
permissions:
  contents: read

concurrency:
  group: security-dependency-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Confirm toolchain versions
        run: |
          node --version
          npm --version
      - name: Regenerate lockfile from manifests
        timeout-minutes: 10
        run: npm install --package-lock-only --ignore-scripts --no-audit --fetch-retries=3 --fetch-timeout=120000 --registry=https://registry.npmjs.org/
      - name: Enforce patched deepmerge-ts in lockfile
        timeout-minutes: 10
        run: npm update deepmerge-ts --package-lock-only --ignore-scripts --no-audit --fetch-retries=3 --fetch-timeout=120000 --registry=https://registry.npmjs.org/
      - name: Install exact lockfile
        timeout-minutes: 15
        run: npm ci --fetch-retries=3 --fetch-timeout=120000 --registry=https://registry.npmjs.org/
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Run test suites
        run: npm test
      - name: Build production bundles
        run: npm run build
      - name: Report dependency audit
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          audit_file="$RUNNER_TEMP/npm-audit.json"
          for attempt in 1 2 3; do
            timeout 75s npm audit --registry=https://registry.npmjs.org/ --json --fetch-retries=0 --fetch-timeout=45000 > "$audit_file" || true
            if node -e 'try { const r = require(process.argv[1]); process.exit(r.error ? 1 : 0); } catch { process.exit(1); }' "$audit_file"; then
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency audit service failed (attempt $attempt/3); retrying in 5 seconds."
              sleep 5
            else
              echo "Dependency audit did not return a valid report after 3 attempts."
            fi
          done
          if ! node -e 'try { const r = require(process.argv[1]); process.exit(r.error ? 1 : 0); } catch { process.exit(1); }' "$audit_file"; then
            echo "Dependency audit failed to return valid JSON after 3 attempts." >&2
            exit 1
          fi
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('Dependency audit summary:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log([item.severity.toUpperCase(), name, `range=${item.range}`, `fixAvailable=${JSON.stringify(item.fixAvailable)}`].join(' | '));
          }
          if (report.error || (report.metadata?.vulnerabilities?.total ?? 0) > 0) {
            console.error('Dependency audit failed or reported vulnerabilities.');
            process.exitCode = 1;
          }
          NODE
      - name: Save proposed lockfile diff for review
        if: always()
        shell: bash
        run: |
          git diff -- package-lock.json > "$RUNNER_TEMP/lockfile-diff.patch"
          if [[ ! -s "$RUNNER_TEMP/lockfile-diff.patch" ]]; then
            echo "No lockfile changes were generated." > "$RUNNER_TEMP/lockfile-diff.patch"
          fi
      - name: Upload lockfile diff for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-lockfile-diff
          path: ${{ runner.temp }}/lockfile-diff.patch
          if-no-files-found: error
          retention-days: 7
