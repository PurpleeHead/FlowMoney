name: Temporary dependency refresh

on:
  push:
    branches: [security/dependency-refresh]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Upgrade npm for lockfile generation
        run: npm install --global npm@11
      - name: Regenerate lockfile from compatible manifest ranges
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Report remaining advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log(JSON.stringify({summary:a.metadata?.vulnerabilities, packages:Object.entries(a.vulnerabilities ?? {}).map(([name,v])=>({name,severity:v.severity,range:v.range,via:v.via,fixAvailable:v.fixAvailable}))},null,2))"
      - name: Report server runtime advisories
        run: |
          npm audit --workspace=@flowmoney/server --omit=dev --json > /tmp/server-runtime-audit.json || true
          node -e "const a=require('/tmp/server-runtime-audit.json'); console.log(JSON.stringify({summary:a.metadata?.vulnerabilities, packages:Object.entries(a.vulnerabilities ?? {}).map(([name,v])=>({name,severity:v.severity,range:v.range,via:v.via,fixAvailable:v.fixAvailable}))},null,2))"
      - name: Commit compatible dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json client/package.json server/package.json
          if git diff --cached --quiet; then
            echo "No compatible dependency updates were available."
          else
            git commit -m "chore(deps): apply compatible security updates"
            git push
          fi
