name: Temporary production audit lockfile refresh

on:
  push:
    branches: [ci/production-audit-final]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh client production dependency classification"
          git push
