name: FlowMoney CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/personal-finance-rework]

permissions:
  contents: read

concurrency:
  group: flowmoney-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate --schema server/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://flowmoney:flowmoney@localhost:5432/flowmoney
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Build server and client
        run: npm run build
      - name: Run server and client tests
        run: npm test
