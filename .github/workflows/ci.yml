name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency audit (non-blocking)
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('Dependency audit summary:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log([
              item.severity.toUpperCase(),
              name,
              `range=${item.range}`,
              `direct=${item.isDirect}`,
              `fixAvailable=${JSON.stringify(item.fixAvailable)}`,
            ].join(' | '));
          }
          if (report.error) console.log('Audit error:', JSON.stringify(report.error));
          NODE
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Run tests
        run: npm test
      - name: Build production bundles
        run: npm run build
