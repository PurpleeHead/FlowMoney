name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test backup TLS and PostgreSQL version gate
        run: bash scripts/test-backup-db-connection.sh
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Enforce clean full dependency audit
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('Dependency audit summary:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const advisories = (item.via ?? []).map((entry) =>
              typeof entry === 'string' ? entry : `${entry.title ?? entry.name ?? 'advisory'} (${entry.url ?? 'URL unavailable'})`
            );
            console.log([
              item.severity.toUpperCase(),
              name,
              `range=${item.range}`,
              `direct=${item.isDirect}`,
              `fixAvailable=${JSON.stringify(item.fixAvailable)}`,
              `nodes=${(item.nodes ?? []).join(',')}`,
              `via=${advisories.join('; ')}`,
            ].join(' | '));
          }
          if (report.error) {
            console.log('Audit error:', JSON.stringify(report.error));
            process.exitCode = 1;
          }
          if ((report.metadata?.vulnerabilities?.total ?? 0) > 0) {
            console.error('Dependency audit found vulnerabilities.');
            process.exitCode = 1;
          }
          NODE
      - name: Enforce clean server production dependency audit
        shell: bash
        run: |
          npm audit --workspace=@flowmoney/server --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          node - "$RUNNER_TEMP/npm-audit-production.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('Production dependency audit summary:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log([
              item.severity.toUpperCase(),
              name,
              `range=${item.range}`,
              `direct=${item.isDirect}`,
              `fixAvailable=${JSON.stringify(item.fixAvailable)}`,
            ].join(' | '));
          }
          if (report.error) {
            console.log('Production audit error:', JSON.stringify(report.error));
            process.exitCode = 1;
          }
          if ((report.metadata?.vulnerabilities?.total ?? 0) > 0) {
            console.error('Server production dependency audit found vulnerabilities.');
            process.exitCode = 1;
          }
          NODE
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Run tests
        run: npm test
      - name: Build production bundles
        run: npm run build


  verify-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowmoney_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flowmoney_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowmoney_test?schema=public
      PSQL_URL: postgresql://postgres:postgres@localhost:5432/flowmoney_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply all migrations to disposable PostgreSQL
        run: npx prisma migrate deploy --schema=server/prisma/schema.prisma
      - name: Verify transaction rollback when ledger write fails
        run: npx tsx server/prisma/tests/verify-transaction-rollback.ts
      - name: Verify receipt and expense rollback when ledger write fails
        run: npx tsx server/prisma/tests/verify-receipt-transaction-rollback.ts
      - name: Verify exchange transaction rollback when ledger sync fails
        run: npx tsx server/prisma/tests/verify-exchange-transaction-rollback.ts
      - name: Verify expense and exchange delete rollback
        run: npx tsx server/prisma/tests/verify-delete-transaction-rollback.ts
      - name: Verify concurrent expense and exchange PATCH/DELETE
        run: npx tsx server/prisma/tests/verify-concurrent-mutations.ts
      - name: Seed legacy records and an existing ledger row
        run: psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f server/prisma/tests/wallet-movement-backfill-fixture.sql
      - name: Verify backfill is idempotent
        shell: bash
        run: |
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f server/prisma/migrations/20261018023500_backfill_wallet_movements/migration.sql
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f server/prisma/migrations/20261018023500_backfill_wallet_movements/migration.sql
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $backfill$
          DECLARE
            movement_count integer;
            card_count integer;
            rub_count integer;
            exchange_usdt_count integer;
            exchange_vnd_count integer;
            card_delta numeric;
          BEGIN
            SELECT count(*) INTO movement_count FROM "WalletMovement" WHERE "userId" = 'backfill-test-user';
            IF movement_count <> 11 THEN
              RAISE EXCEPTION 'Expected 11 unique movements after two backfills, got %', movement_count;
            END IF;
            SELECT count(*), min("amountDelta") INTO card_count, card_delta
              FROM "WalletMovement" WHERE "sourceKey" = 'expense:backfill-card-expense:USDT';
            IF card_count <> 1 OR card_delta <> -2.19 THEN
              RAISE EXCEPTION 'Card expense duplicated or incorrect: count %, delta %', card_count, card_delta;
            END IF;
            SELECT count(*) INTO rub_count FROM "WalletMovement" WHERE "sourceKey" = 'expense:backfill-rub-expense:RUB' AND "amountDelta" = -100;
            IF rub_count <> 1 THEN RAISE EXCEPTION 'RUB expense debit missing or duplicated'; END IF;
            SELECT count(*) INTO exchange_usdt_count FROM "WalletMovement" WHERE "sourceKey" = 'exchange:backfill-exchange:USDT' AND "amountDelta" = 93.7853;
            IF exchange_usdt_count <> 1 THEN RAISE EXCEPTION 'USDT exchange credit missing or duplicated'; END IF;
            SELECT count(*) INTO exchange_vnd_count FROM "WalletMovement" WHERE "sourceKey" = 'exchange:backfill-exchange:VND' AND "amountDelta" = 250000;
            IF exchange_vnd_count <> 1 THEN RAISE EXCEPTION 'VND exchange credit missing or duplicated'; END IF;
            IF (SELECT count(*) FROM "WalletMovement" WHERE "sourceKey" = 'exchange:backfill-unknown-vnd:VND') <> 0 THEN
              RAISE EXCEPTION 'Unknown VND outcome must not create a VND movement';
            END IF;
            IF (SELECT count(*) FROM "WalletMovement" WHERE "sourceKey" = 'exchange:backfill-unknown-vnd:USDT' AND "amountDelta" = 5) <> 1 THEN
              RAISE EXCEPTION 'Known USDT credit with unknown VND outcome is missing';
            END IF;
            IF (SELECT count(*) FROM "WalletMovement" WHERE "sourceKey" = 'exchange:backfill-direct-vnd:RUB' AND "amountDelta" = -1000) <> 1 THEN
              RAISE EXCEPTION 'Direct RUB/VND exchange RUB debit missing';
            END IF;
            IF (SELECT count(*) FROM "WalletMovement" WHERE "sourceKey" = 'exchange:backfill-direct-vnd:VND' AND "amountDelta" = 30000) <> 1 THEN
              RAISE EXCEPTION 'Direct RUB/VND exchange VND credit missing';
            END IF;
            IF (SELECT count(*) FROM "WalletMovement" WHERE "sourceKey" = 'exchange:backfill-zero-vnd:RUB' AND "amountDelta" = -300) <> 1 THEN
              RAISE EXCEPTION 'Explicit zero-VND exchange must preserve its RUB debit';
            END IF;
            IF (SELECT count(*) FROM "WalletMovement" WHERE "sourceKey" = 'exchange:backfill-zero-vnd:VND') <> 0 THEN
              RAISE EXCEPTION 'Explicit zero VND outcome must not fall back to targetReceived';
            END IF;
            IF (SELECT count(*) FROM "WalletMovement" WHERE "sourceKey" LIKE 'exchange:backfill-direct-vnd:USDT') <> 0 THEN
              RAISE EXCEPTION 'Direct RUB/VND exchange must not create a USDT movement';
            END IF;
            IF (SELECT count(*) FROM "WalletMovement" WHERE "sourceKey" = 'exchange:backfill-invalid-rub-target:RUB' AND "amountDelta" = -200) <> 1 THEN
              RAISE EXCEPTION 'Invalid historical RUB target must preserve the RUB outflow';
            END IF;
            IF (SELECT count(*) FROM "WalletMovement" WHERE "sourceKey" = 'exchange:backfill-invalid-rub-target:RUB' AND "amountDelta" > 0) <> 0 THEN
              RAISE EXCEPTION 'Invalid historical RUB target must not credit RUB';
            END IF;
            IF (SELECT sum("amountDelta") FROM "WalletMovement" WHERE "userId" = 'backfill-test-user' AND "currency" = 'RUB') <> -10400 THEN
              RAISE EXCEPTION 'RUB movement total does not reconcile';
            END IF;
            IF (SELECT sum("amountDelta") FROM "WalletMovement" WHERE "userId" = 'backfill-test-user' AND "currency" = 'USDT') <> 96.5953 THEN
              RAISE EXCEPTION 'USDT movement total does not reconcile';
            END IF;
            IF (SELECT sum("amountDelta") FROM "WalletMovement" WHERE "userId" = 'backfill-test-user' AND "currency" = 'VND') <> 280000 THEN
              RAISE EXCEPTION 'VND movement total does not reconcile';
            END IF;
          END $backfill$;
          SQL
      - name: Verify encrypted PostgreSQL backup round-trip
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes age postgresql-client
          work_dir="$RUNNER_TEMP/flowmoney-restore-drill"
          mkdir -p "$work_dir"
          trap 'rm -rf "$work_dir"' EXIT
          identity="$work_dir/age-identity.txt"
          age-keygen -o "$identity" 2>/dev/null
          recipient="$(age-keygen -y "$identity")"
          pg_url="$(bash scripts/normalize-backup-db-url.sh)"
          pg_dump "$pg_url" --format=custom --no-owner --no-acl --file="$work_dir/flowmoney.dump"
          test -s "$work_dir/flowmoney.dump"
          age --recipient "$recipient" --output "$work_dir/flowmoney.dump.age" "$work_dir/flowmoney.dump"
          test -s "$work_dir/flowmoney.dump.age"
          rm "$work_dir/flowmoney.dump"
          age --decrypt --identity "$identity" --output "$work_dir/restored.dump" "$work_dir/flowmoney.dump.age"
          test -s "$work_dir/restored.dump"
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE flowmoney_restore_test'
          restore_url='postgresql://postgres:postgres@localhost:5432/flowmoney_restore_test'
          pg_restore --exit-on-error --no-owner --no-acl --dbname="$restore_url" "$work_dir/restored.dump"
          restored_schema="$(psql "$restore_url" --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 --command="SELECT (to_regclass('public.\"User\"') IS NOT NULL AND to_regclass('public.\"WalletMovement\"') IS NOT NULL AND to_regclass('public.\"_prisma_migrations\"') IS NOT NULL)")"
          [[ "$restored_schema" == "t" ]] || { echo "::error::Encrypted backup restore is missing required FLOWMONEY tables."; exit 1; }
          movement_count="$(psql "$restore_url" --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 --command="SELECT count(*) FROM \"WalletMovement\" WHERE \"userId\" = 'backfill-test-user'")"
          [[ "$movement_count" == "11" ]] || { echo "::error::Restored wallet movement count mismatch: $movement_count"; exit 1; }
          echo "PASS: encrypted backup decrypted, restored to a separate disposable database, and key tables/data verified."
