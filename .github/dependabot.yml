version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    groups:
      npm-security-and-patch:
        applies-to: security-updates
        patterns:
          - "*"
      npm-patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    labels:
      - dependencies
      - security
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - dependencies
      - security
