services:
  - type: web
    name: flowmoney-app
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npx prisma migrate deploy --schema server/prisma/schema.prisma && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://flowmoney-app.onrender.com
      - key: APP_URL
        value: https://flowmoney-app.onrender.com
