services:
  - type: web
    name: flowmoney-app
    runtime: node
    plan: free
    region: singapore
    # Keep deploys manual until the owner has verified the production database,
    # encrypted backup, restore test, and migration gate.
    autoDeployTrigger: "off"
    buildCommand: npm ci && npm run db:generate && npm run build
    # Production migrations are an explicit release step, never a web-service startup side effect.
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://flowmoney-app.onrender.com
      - key: APP_URL
        value: https://flowmoney-app.onrender.com
